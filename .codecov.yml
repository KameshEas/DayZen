coverage:
  precision: 2
  round: down
  range: "70...100"

flags:
  flutter:
    paths:
      - lib/**
    carryforward: true

ignore:
  - "**.freezed.dart"
  - "**.g.dart"
  - "**.config.dart"
  - "lib/main.dart"
  - "lib/**/*.*.dart"

comment:
  layout: "reach,diff,files"
  behavior: default
  require_changes: false
  require_base: false
  show_carryforward_flags: true

codecov:
  require_ci_to_pass: false
